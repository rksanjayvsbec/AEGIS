<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="badgeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Hexagonal Shield Plate -->
  <polygon points="250,30 430,120 430,340 250,470 70,340 70,120" 
           fill="url(#badgeDark)" stroke="url(#badgeGrad)" stroke-width="8" stroke-linejoin="round"
           filter="url(#badgeShadow)"/>

  <!-- Geometric Faceted Apex / 'A' Silhouette -->
  <!-- Top Prism -->
  <polygon points="250,90 330,220 250,185 170,220" 
           fill="url(#badgeGrad)" opacity="0.95"/>
  <!-- Left Wing -->
  <polygon points="170,235 235,205 185,350 145,350" 
           fill="#38BDF8" opacity="0.8"/>
  <!-- Right Wing -->
  <polygon points="330,235 265,205 315,350 355,350" 
           fill="#6366F1" opacity="0.8"/>
  <!-- Central Energy Core -->
  <polygon points="250,220 280,290 250,335 220,290" 
           fill="#FFFFFF"/>
           
  <!-- Bottom Text within Badge -->
  <text x="250" y="420" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="12" 
        text-anchor="middle" 
        fill="#FFFFFF">
    AEGIS
  </text>
</svg>
