<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aegisGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#0052D4"/>
    </linearGradient>
    <linearGradient id="aegisGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="100%" stop-color="#4364F7"/>
    </linearGradient>
    <linearGradient id="aegisGradGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield Glow -->
  <path d="M250,55 L390,115 C390,260 295,360 250,410 C205,360 110,260 110,115 Z"
        fill="url(#aegisGradGlow)" filter="url(#neonGlow)" opacity="0.6"/>

  <!-- Outer Aegis Shield Contour -->
  <path d="M250,60 L385,118 C385,255 292,352 250,402 C208,352 115,255 115,118 Z" 
        fill="none" stroke="url(#aegisGradPrimary)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Inner Geometric "A" Motif -->
  <!-- Left leg of A forming shield faceted segment -->
  <path d="M250,110 L165,290 L205,290 L235,225 L250,225" 
        fill="url(#aegisGradAccent)"/>
        
  <!-- Right leg & dynamic angled crossbar of A -->
  <path d="M250,110 L335,290 L295,290 L265,225 L215,225 L250,150 L275,205 L245,205 Z" 
        fill="url(#aegisGradPrimary)"/>

  <!-- Lower Core Defense Diamond Anchor -->
  <polygon points="250,255 285,320 250,355 215,320" 
           fill="url(#aegisGradPrimary)" opacity="0.9"/>
  
  <!-- Sleek Central Apex Spike -->
  <polygon points="250,85 262,130 250,145 238,130" 
           fill="#00F2FE"/>
</svg>
